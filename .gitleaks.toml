# Secret scanning settings (used by the "Check for leaked secrets" job in CI).
# Gitleaks' default rules still apply to every other file.

[extend]
useDefault = true

# public/config.js holds only public website settings. Firebase web API keys (AIza…) are
# public by design: they identify the app, and the Firestore rules and server checks protect
# the data. Everything else in the repository, including any secret pasted into config.js
# elsewhere, is still scanned.
[allowlist]
description = "public/config.js holds public website settings only"
paths = ['''^public/config\.js$''']
