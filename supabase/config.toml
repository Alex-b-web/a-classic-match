# Supabase CLI settings. Replace with your own project's reference ID
# (Supabase → Project Settings → General → Project ID), then run:
#   npx supabase login
#   npx supabase functions deploy --project-ref YOUR-PROJECT-REF
project_id = "YOUR-PROJECT-REF"

# Each function checks who is calling itself (the reader's sign-in token, or the cron secret),
# so the gateway check is switched off. This also works with Supabase's newer API keys.
[functions.delete-account]
verify_jwt = false

[functions.welcome-email]
verify_jwt = false

[functions.streak-reminders]
verify_jwt = false
